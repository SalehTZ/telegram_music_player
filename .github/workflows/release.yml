name: Release

# Push a tag like v0.2.0 to build the APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with the Flutter version used to create pubspec.lock.
  FLUTTER_VERSION: "3.16.9"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # assets/audio is listed in pubspec.yaml but its contents are git-ignored.
      - name: Create git-ignored asset folder
        run: mkdir -p assets/audio

      - name: Install dependencies
        run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK is signed with a temporary debug key and can't update an earlier install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "telegram-music-player-$GITHUB_REF_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "telegram-music-player-$GITHUB_REF_NAME.apk" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
