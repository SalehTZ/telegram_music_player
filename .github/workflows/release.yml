name: Release

# Push a tag like v0.2.0 to build the APKs and publish them as a GitHub
# release, then add the Linux, Windows and macOS builds to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with the Flutter version used to create pubspec.lock.
  FLUTTER_VERSION: "3.47.8"
  # SHA-256 of the release certificate, shared with Snag and published in
  # README.md. Releases signed with any other key are refused.
  RELEASE_CERT_SHA256: a5350aaa8abc946cc86836b770f66170d3efc2ae7e6c15b3dd0a3ce6a6aa138d

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The release key lives in GitHub encrypted secrets (the same ones as
      # Snag), never in the repo.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Releases must be signed. Add the ANDROID_KEYSTORE_* secrets (the same ones as Snag)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify signature
        shell: bash
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if ! grep -qi "$RELEASE_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk isn't signed with the release key (SHA-256 $RELEASE_CERT_SHA256)."
              exit 1
            fi
          done

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      # Stable names (no version) so links like
      # releases/latest/download/stash-android-arm64-v8a.apk
      # always point at the newest build.
      - name: Rename
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "dist/stash-android-$abi.apk"
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # The desktop builds join the release once it exists, so a desktop failure
  # never holds back the APKs.
  desktop:
    name: Add ${{ matrix.name }} build
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools and libmpv
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: |
          flutter build ${{ matrix.target }} --release \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          mkdir dist
          case ${{ matrix.target }} in
            linux)
              tar -czf dist/stash-linux-x64.tar.gz \
                -C build/linux/x64/release/bundle . ;;
            windows)
              (cd build/windows/x64/runner/Release && 7z a -tzip \
                "$GITHUB_WORKSPACE/dist/stash-windows-x64.zip" .) ;;
            macos)
              ditto -c -k --keepParent build/macos/Build/Products/Release/Stash.app \
                dist/stash-macos.zip ;;
          esac
          # macOS has shasum only, Windows' Git Bash sha256sum only
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd dist && sum ./* > "SHA256SUMS-${{ matrix.target }}.txt")
          cat dist/SHA256SUMS-*.txt

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
