name: Release

# Push a tag like v0.2.0 to build the APKs, the desktop and iOS packages, and
# publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Keep in sync with the Flutter version used to create pubspec.lock.
  FLUTTER_VERSION: "3.47.8"
  # SHA-256 of the release certificate, shared with Snag and published in
  # README.md. Releases signed with any other key are refused.
  RELEASE_CERT_SHA256: a5350aaa8abc946cc86836b770f66170d3efc2ae7e6c15b3dd0a3ce6a6aa138d

jobs:
  android:
    name: Android (signed APKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The release key lives in GitHub encrypted secrets (the same ones as
      # Snag), never in the repo.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Releases must be signed. Add the ANDROID_KEYSTORE_* secrets (the same ones as Snag)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "${GITHUB_REF_NAME#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify signature
        shell: bash
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
            if ! grep -qi "$RELEASE_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk isn't signed with the release key (SHA-256 $RELEASE_CERT_SHA256)."
              exit 1
            fi
          done

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      # Stable names (no version) so links like
      # releases/latest/download/stash-android-arm64-v8a.apk
      # always point at the newest build.
      - name: Rename
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "dist/stash-android-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stash-android
          path: dist/*.apk

  packages:
    name: Packages
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}

  # Obtainium follows these releases for the APKs, so a desktop or iOS build
  # that breaks leaves its files out instead of holding the release back.
  publish:
    name: Publish release
    needs: [android, packages]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: stash-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.packages.result }}
        run: |
          notes=()
          if [ "$PACKAGES" != success ]; then
            notes=(--notes "Some desktop or iOS packages failed to build and are missing from this release.")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}" \
            --generate-notes \
            --verify-tag
